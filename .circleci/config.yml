version: 2.1
workflows:
  btd:
    jobs:
      - build
jobs:
  build:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - run:
          name: Install OpenVPN
          command: |
            # Wymuszamy brak pytań podczas instalacji
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update
            sudo apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" openvpn openvpn-systemd-resolved

      - run:
          name: Check IP before VPN connection
          command: |
            echo "Public IP before VPN connection is $(curl checkip.amazonaws.com)"

      - run:
          name: VPN Setup
          command: |
            # Tworzymy folder, jeśli go nie ma (na wszelki wypadek)
            sudo mkdir -p /etc/openvpn

            # Dekodujemy plik do katalogu /tmp (bezpieczna lokalizacja na Ubuntu)
            echo $VPN_CLIENT_CONFIG | base64 --decode | sudo tee /tmp/config.ovpn > /dev/null

            # Sprawdzamy czy wymagane jest hasło
            if grep -q auth-user-pass /tmp/config.ovpn; then
              if [ -z "${VPN_USER:-}" ] || [ -z "${VPN_PASSWORD:-}" ]; then
                echo "BŁĄD: Ustaw zmienne VPN_USER i VPN_PASSWORD!"
                exit 1
              else
                printf "$VPN_USER\\n$VPN_PASSWORD" > /tmp/vpn.login
                # Poprawiamy ścieżkę do pliku z hasłem wewnątrz konfiguracji
                sudo sed -i 's|^auth-user-pass.*|auth-user-pass /tmp/vpn.login|' /tmp/config.ovpn
              fi
            fi

      - run:
          name: Connect to VPN
          background: true
          command: |
            echo "Starting VPN session..."
            sudo launchctl load /Library/LaunchDaemons/org.openvpn.plist
            sudo launchctl start org.openvpn


      - run:
          name: Wait for VPN
          command: |
            printf "Attempting to connect to VPN server...\n\n"

            counter=1
            until [ -f /tmp/openvpn.log ] && [ "$(grep -c "Initialization Sequence Completed" /tmp/openvpn.log)" != 0 ] || [ "$counter" -ge 10 ]; do
              ((counter++))

              sleep 5
            done

            if [ ! -f /tmp/openvpn.log ] || (! grep -iq "Initialization Sequence Completed" /tmp/openvpn.log); then
              printf "Unable to establish connection within the allocated time ---> Giving up."
            else
              printf "Connected to VPN\nPublic IP is now %s" "$(curl -s http://checkip.amazonaws.com)"
            fi

      - run:
          name: Run Steps
          command: |
            echo "Run steps here"
            sleep 10
      - run:
          name: Disconnect from OpenVPN
          command: sudo launchctl stop org.openvpn
          when: always
      - store_artifacts:
          path: /tmp/openvpn.log
 