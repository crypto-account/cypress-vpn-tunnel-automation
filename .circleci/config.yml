version: 2.1

jobs:
  test_vpn_connection:
    machine: true   # pełna maszyna VM, nie kontener Docker
    resource_class: large
    steps:
      - checkout
      
      - run:
          name: Use Node.js 20
          command: |
            nvm install 20
            nvm use 20
            node -v
            npm -v

      - run:
          name: Install Cypress
          command: |
            npm install cypress

      - run:
          name: Install OpenVPN
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo apt update
            sudo apt install -y openvpn openvpn-systemd-resolved

      - run:
          name: Check IP before VPN connection
          command: |
            echo "Public IP before VPN connection is $(curl -s checkip.amazonaws.com)"

      - run:
    name: VPN Setup and Connect
    command: |
      echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn

      sudo openvpn --config /tmp/config.ovpn \
        --daemon \
        --log /tmp/openvpn.log

      sudo chmod 644 /tmp/openvpn.log

      counter=1
      until grep -q "Initialization Sequence Completed" /tmp/openvpn.log || [ "$counter" -ge 20 ]; do
        echo "Waiting for VPN... ($counter)"
        counter=$((counter+1))
        sleep 2
      done

      if ! grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then
        echo "VPN failed!"
        cat /tmp/openvpn.log
        exit 1
      else
        echo "VPN connected successfully."
        curl -s https://checkip.amazonaws.com || true
      fi
      


      - run:
          name: Run Cypress Tests
          command: |
            npm install
            npx cypress run --browser electron --spec "cypress/e2e/vpn-test.cy.js"

      - run:
          name: Disconnect from OpenVPN
          command: |
            sudo killall openvpn || true
          when: always

workflows:
  version: 2
  btd:
    jobs:
      - test_vpn_connection:
          filters:
            branches:
              only: main
