version: 2.1
workflows:
  btd:
    jobs:
      - build
jobs:
  build:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - run:
          name: Install OpenVPN
          command: |
            # Wymuszamy brak pytań podczas instalacji
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update
            sudo apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" openvpn openvpn-systemd-resolved

      - run:
          name: Check IP before VPN connection
          command: |
            echo "Public IP before VPN connection is $(curl checkip.amazonaws.com)"

      - run:
          name: VPN Setup & Connect
          background: true
          command: |
            # 1. Dekodowanie konfiguracji
            echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn

            # 2. Dynamiczne wykluczenie IP CircleCI (Split Tunneling), aby nie zerwać builda
            # To zapobiega błędom sieciowym podczas startu
            for IP in $(host runner.circleci.com | awk '{ print $4; }'); do
              echo "route $IP 255.255.255.255 net_gateway" >> /tmp/config.ovpn
            done

            # 3. Uruchomienie VPN
            # Dodajemy --dev tun, aby wymusić sterownik sieciowy Linuxa
            sudo openvpn \
              --config /tmp/config.ovpn \
              --daemon \
              --log /tmp/openvpn.log \
              --dev tun \
              --data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305:AES-128-CBC \
              --script-security 2


      - run:
          name: Wait for VPN
          command: |
            printf "Attempting to connect to VPN server...\n\n"

            counter=1
            until [ -f /tmp/openvpn.log ] && [ "$(grep -c "Initialization Sequence Completed" /tmp/openvpn.log)" != 0 ] || [ "$counter" -ge 10 ]; do
              ((counter++))

              sleep 5
            done

            if [ ! -f /tmp/openvpn.log ] || (! grep -iq "Initialization Sequence Completed" /tmp/openvpn.log); then
              printf "Unable to establish connection within the allocated time ---> Giving up."
            else
              printf "Connected to VPN\nPublic IP is now %s" "$(curl -s http://checkip.amazonaws.com)"
            fi

      - run:
          name: Run Steps
          command: |
            echo "Run steps here"
            sleep 10
      - run:
          name: Disconnect from OpenVPN
          command: sudo launchctl stop org.openvpn
          when: always
      - store_artifacts:
          path: /tmp/openvpn.log
 