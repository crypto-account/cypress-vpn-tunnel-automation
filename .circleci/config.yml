version: 2.1

jobs:
  test_vpn_connection:
    machine: true   # pełna maszyna VM, nie kontener Docker
    resource_class: large
    steps:
      - checkout
      
      - run:
    name: Install Node.js 20 (NVM) for Cypress
    command: |
      export NVM_DIR="$HOME/.nvm"
      mkdir -p "$NVM_DIR"

      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash

      source "$NVM_DIR/nvm.sh"
      nvm install 20
      nvm alias default 20
      nvm use 20

      echo 'export NVM_DIR="$HOME/.nvm"' >> ~/.bashrc
      echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> ~/.bashrc

      node -v
      npm -v


      - run:
          name: Install OpenVPN
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo apt update
            sudo apt install -y openvpn openvpn-systemd-resolved

      - run:
          name: Check IP before VPN connection
          command: |
            echo "Public IP before VPN connection is $(curl -s checkip.amazonaws.com)"

      - run:
          name: VPN Setup and Connect
          command: |
            # Dekodowanie konfiguracji VPN z base64
            echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn

            # Jeśli VPN wymaga loginu i hasła
            if grep -q auth-user-pass /tmp/config.ovpn; then
              printf "${VPN_USER}\\n${VPN_PASSWORD}" > /tmp/vpn.login
            fi

            # Start VPN w tle
            sudo openvpn --config /tmp/config.ovpn --daemon --log /tmp/openvpn.log \
              $( [ -f /tmp/vpn.login ] && echo "--auth-user-pass /tmp/vpn.login" )
              sudo chmod 644 /tmp/openvpn.log

            # Czekanie na połączenie VPN
            counter=1
            until grep -q "Initialization Sequence Completed" /tmp/openvpn.log || [ "$counter" -ge 15 ]; do
              ((counter++))
              echo "Waiting for VPN... ($counter)"
              sleep 2
            done

            if ! grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then
              echo "VPN Log Output:"
              cat /tmp/openvpn.log
              exit 1
            else
              echo "VPN connected successfully."
              echo "Public IP is now: $(curl -s checkip.amazonaws.com)"
            fi

      - run:
          name: Run Cypress Tests
          command: |
            npm install
            npx cypress run --browser electron --spec "cypress/e2e/vpn-test.cy.js"

      - run:
          name: Disconnect from OpenVPN
          command: |
            sudo killall openvpn || true
          when: always

workflows:
  version: 2
  btd:
    jobs:
      - test_vpn_connection:
          filters:
            branches:
              only: main
