version: 2.1

jobs:
  build:
    # Zmieniamy na nowszy obraz i darmową klasę zasobów
    machine:
      image: ubuntu-2204:2023.07.2
    resource_class: medium
    
    steps:
      - checkout

      - run:
          name: Install Node.js and Cypress Dependencies
          command: |
            # Instalacja Node.js (potrzebne do Cypressa)
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get install -y nodejs
            # Zależności systemowe dla Cypress
            sudo apt-get install -y libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2 libxtst6 xauth xvfb

      - run:
          name: Install OpenVPN
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo apt update
            sudo apt install -y openvpn openvpn-systemd-resolved

      - run:
          name: Check IP before VPN connection
          command: |
            echo "Public IP before VPN connection is $(curl -s checkip.amazonaws.com)"

      - run:
          name: VPN Setup and Connect
          command: |
            # Używamy Twojej zmiennej VPN_CLIENT_CONFIG
            echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn

            if grep -q auth-user-pass /tmp/config.ovpn; then
                # Sprawdzamy czy zmienne istnieją (używamy nazw z Twojego skryptu)
                printf "${VPN_USER}\\n${VPN_PASSWORD}" > /tmp/vpn.login
            fi

            # Start VPN
            sudo openvpn --config /tmp/config.ovpn --daemon --log /tmp/openvpn.log \
              --auth-user-pass /tmp/vpn.login || sudo openvpn --config /tmp/config.ovpn --daemon --log /tmp/openvpn.log

            # Czekaj na połączenie (zwiększony limit do 30 sek)
            counter=1
            until grep -q "Initialization Sequence Completed" /tmp/openvpn.log || [ "$counter" -ge 15 ]; do
              ((counter++))
              echo "Waiting for VPN... ($counter)"
              sleep 2
            done

            if ! grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then
              echo "VPN Log Output:"
              cat /tmp/openvpn.log
              exit 1
            else
              echo "VPN connected successfully."
              echo "Public IP is now: $(curl -s checkip.amazonaws.com)"
            fi

      - run:
          name: Run Cypress Tests
          command: |
            npm install
            # Uruchamiamy Twój test z poprzednich kroków
            npx cypress run --browser electron --spec "cypress/e2e/vpn_check.cy.js"

      - run:
          name: Disconnect from OpenVPN
          command: |
            sudo killall openvpn || true
          when: always

workflows:
  btd:
    jobs:
      - build:
          filters:
            branches:
              only: main