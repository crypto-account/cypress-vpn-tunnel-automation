version: 2.1

jobs:
  test_vpn_connection:
    machine: true
    resource_class: large

    steps:
      - checkout
      
      - run:
          name: Use Node.js 20
          command: |
            nvm install 20
            nvm use 20
            node -v
            npm -v

      - run:
          name: Install Cypress 
          command: |
            npm install cypress 

      - run:
          name: Install OpenVPN
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo apt update
            sudo apt install -y openvpn openvpn-systemd-resolved

      - run:
          name: Check IP before VPN connection
          command: |
            echo "Public IP before VPN connection is $(curl -s checkip.amazonaws.com)"

      - run:
          name: VPN Setup and Connect
          command: |
            # Zapisz config OVPN
            echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn

            # Login + Hasło
            echo "${VPN_USER}" > /tmp/vpn.login
            echo "${VPN_PASSWORD}" >> /tmp/vpn.login
            chmod 600 /tmp/vpn.login

            # Uruchom VPN
            sudo openvpn \
              --config /tmp/config.ovpn \
              --auth-user-pass /tmp/vpn.login \
              --daemon \
              --log /tmp/openvpn.log

            sudo chmod 644 /tmp/openvpn.log

            echo "Waiting for VPN to connect..."
            counter=1
            until grep -q "Initialization Sequence Completed" /tmp/openvpn.log || [ "$counter" -ge 30 ]; do
              echo "Waiting... ($counter)"
              counter=$((counter+1))
              sleep 2
            done

            if ! grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then
              echo "VPN failed!"
              cat /tmp/openvpn.log
              exit 1
            else
              echo "VPN connected successfully."
              echo "IP after VPN:"
              curl -s https://checkip.amazonaws.com || true
            fi

            echo "Ensure OpenVPN is running:"
            ps aux | grep openvpn || true

      - run:
          name: Run Cypress Tests
          command: |
            npm install
            npx cypress run --browser electron --spec "cypress/e2e/vpn-test.cy.js"

      - run:
          name: Disconnect from OpenVPN
          command: |
            sudo killall openvpn || true
          when: always

workflows:
  version: 2
  btd:
    jobs:
      - test_vpn_connection:
          filters:
            branches:
              only: main
