version: 2.1

jobs:
  test_with_vpn:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout

      - run:
          name: Install OpenVPN
          command: |
            sudo apt-get update
            sudo apt-get install -y openvpn openvpn-systemd-resolved

      - run:
          name: Setup and Connect VPN
          command: |
            # 1. Dekodowanie konfiguracji
            echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn

            # 2. Uruchomienie OpenVPN
            # Dodajemy --data-ciphers AES-128-CBC, bo Twój plik używa starego szyfru, 
            # który nowa wersja OpenVPN w Ubuntu 22.04 domyślnie blokuje.
            sudo openvpn --config /tmp/config.ovpn --daemon --log /tmp/openvpn.log \
              --data-ciphers AES-128-CBC:AES-256-GCM:AES-128-GCM \
              --script-security 2 \
              --up /etc/openvpn/update-systemd-resolved \
              --down /etc/openvpn/update-systemd-resolved \
              --down-pre

            # 3. Nadanie uprawnień do logów, aby móc je sprawdzić
            sudo chmod 644 /tmp/openvpn.log

            # 4. Czekanie na połączenie (timeout 45 sek)
            echo "Waiting for VPN connection..."
            timeout 45s bash -c 'until grep -q "Initialization Sequence Completed" /tmp/openvpn.log; do sleep 2; done'
            
            if [ $? -ne 0 ]; then
              echo "VPN Connection Failed!"
              cat /tmp/openvpn.log
              exit 1
            fi
            echo "VPN Connected Successfully."

      - run:
          name: Verify IP Address
          command: |
            echo "Twój adres IP po połączeniu z VPN:"
            curl -s https://checkip.amazonaws.com

      - run:
          name: Run Tests
          command: |
            echo "Tutaj wstaw komendę do testów, np. npm test"

workflows:
  version: 2
  build_and_test:
    jobs:
      - test_with_vpn