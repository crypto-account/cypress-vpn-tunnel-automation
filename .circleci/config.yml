version: 2.1

jobs:
  vpn_test_job:
    machine:
      image: ubuntu-2204:2023.10.1  # Better stability for OpenVPN 2.5+
    steps:
      - checkout
      
      - run:
          name: Install OpenVPN
          command: |
            sudo apt update
            sudo apt install -y openvpn openvpn-systemd-resolved

      - run:
          name: Connect to VPN Gate
          command: |
            # 1. Decode the config
            echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn

            # 2. VPN Gate usually uses 'vpn' as both user and password
            # Some servers don't need this, but it doesn't hurt to have it ready
            printf "vpn\nvpn" > /tmp/vpn.login

            # 3. Start OpenVPN in the background
            # We use --auth-user-pass only if the config file asks for it
            sudo openvpn --config /tmp/config.ovpn --daemon --log /tmp/openvpn.log --auth-user-pass /tmp/vpn.login

            # 4. Wait for connection (Timeout after 45s)
            echo "Waiting for connection..."
            for i in {1..22}; do
              if grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then
                echo "VPN Connected!"
                break
              fi
              echo "Still waiting..."
              sleep 2
            done

            if ! grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then
              echo "Failed to connect to VPN Gate server."
              cat /tmp/openvpn.log
              exit 1
            fi

      - run:
          name: Verify IP and Location
          command: |
            echo "Your new IP is: $(curl -s https://checkip.amazonaws.com)"
            curl -s https://ipapi.co/json/ | grep -E "city|country_name"

      - run:
          name: Run your tests (Cypress/Node)
          command: |
            # Your test commands here
            echo "Running tests over VPN..."

workflows:
  test_flow:
    jobs:
      - vpn_test_job