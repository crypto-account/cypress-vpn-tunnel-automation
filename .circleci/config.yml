version: 2.1
workflows:
  btd:
    jobs:
      - build
jobs:
  build:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - run:
          name: Install OpenVPN
          command: |
            # Wymuszamy brak pytań podczas instalacji
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update
            sudo apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" openvpn openvpn-systemd-resolved

      - run:
          name: Check IP before VPN connection
          command: |
            echo "Public IP before VPN connection is $(curl checkip.amazonaws.com)"

      - run:
          name: VPN Setup & Connect
          background: true
          command: |
            # 1. Dekodowanie konfiguracji
            echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn

            # 2. Przygotowanie pliku logów z odpowiednimi uprawnieniami
            sudo touch /tmp/openvpn.log
            sudo chmod 666 /tmp/openvpn.log

            # 3. Dynamiczne wykluczenie IP CircleCI (Split Tunneling)
            for IP in $(host runner.circleci.com | awk '{ print $4; }'); do
              echo "route $IP 255.255.255.255 net_gateway" >> /tmp/config.ovpn
            done

            # 4. Uruchomienie VPN
            sudo openvpn \
              --config /tmp/config.ovpn \
              --daemon \
              --log /tmp/openvpn.log \
              --dev tun \
              --data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305:AES-128-CBC \
              --script-security 2

      - run:
          name: Wait for VPN
          command: |
            printf "Attempting to connect to VPN server...\n\n"

            counter=1
            # Używamy sudo grep, aby mieć pewność dostępu do logów roota
            until [ -f /tmp/openvpn.log ] && [ "$(sudo grep -c "Initialization Sequence Completed" /tmp/openvpn.log)" != 0 ] || [ "$counter" -ge 12 ]; do
              echo "Waiting for connection... (Attempt $counter/12)"
              ((counter++))
              sleep 5
            done

            if ! sudo grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then
              printf "\nUnable to establish connection within the allocated time.\n"
              printf "--- LAST 20 LINES OF LOG ---\n"
              sudo tail -n 20 /tmp/openvpn.log
              exit 1
            else
              printf "\nConnected to VPN\n"
              printf "Public IP is now: %s\n" "$(curl -s http://checkip.amazonaws.com)"
            fi
      
      - run:
          name: Install Dependencies
          command: npm install  # lub yarn install

      - run:
          name: Run Cypress Tests
          command: |
            # Uruchamiamy Cypressa w trybie headless (bez okna)
            # Podajemy ścieżkę do konkretnego pliku testowego, który stworzyliśmy
            npx cypress run --spec "cypress/e2e/vpn_test.cy.js"

      - run:
          name: Run Steps
          command: |
            echo "Run steps here"
            sleep 10
      - run:
          name: Disconnect from OpenVPN
          command: |
            # Zatrzymuje wszystkie procesy openvpn
            sudo killall openvpn || true
          when: always
      - store_artifacts:
          path: /tmp/openvpn.log
 