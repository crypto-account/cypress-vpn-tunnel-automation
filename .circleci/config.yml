version: 2.1

jobs:
  test_vpn_connection:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Install OpenVPN
          command: |
            sudo apt-get update && sudo apt-get install -y openvpn curl
      - run:
          name: Prepare VPN config
          command: |
            echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn
            echo "$vpn" > /tmp/creds
            echo "$vpn" >> /tmp/creds
            chmod 600 /tmp/creds
            grep -q "^auth-user-pass" /tmp/config.ovpn || echo "auth-user-pass /tmp/creds" >> /tmp/config.ovpn
      - run:
          name: Start VPN
          background: true
          command: |
            sudo openvpn --config /tmp/config.ovpn --daemon --log /tmp/ovpn.log --verb 3
            sleep 15
            cat /tmp/ovpn.log | tail -n 20
      - run:
          name: Check IP
          command: |
            echo "Current public IP:"
            curl -s https://checkip.amazonaws.com
      - run:
          name: Install Node.js and Cypress
          command: |
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
            npm install
      - run:
          name: Run Cypress tests
          command: npx cypress run --browser electron --spec "cypress/e2e/vpn-test.cy.js"

workflows:
  pipeline:
    jobs:
      - test_vpn_connection:
          filters:
            branches:
              only: main
