version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2004:202201-02
    resource_class: large
    steps:
      - run:
          name: Install OpenVPN
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo apt update
            sudo apt install -y openvpn openvpn-systemd-resolved

      - run:
          name: Check IP before VPN connection
          command: |
            ip a
            echo "Public IP before VPN connection is $(curl -s checkip.amazonaws.com)"

      - run:
          name: VPN Setup and Connect
          command: |
            echo $VPN_CLIENT_CONFIG | base64 --decode > /tmp/config.ovpn

            if grep -q auth-user-pass /tmp/config.ovpn; then
              if [ -z "${VPN_USER:-}" ] || [ -z "${VPN_PASSWORD:-}" ]; then
                echo "Your VPN client is configured with a user-locked profile. Make sure to set the VPN_USER and VPN_PASSWORD environment variables"
                exit 1
              else
                printf "$VPN_USER\\n$VPN_PASSWORD" > /tmp/vpn.login
              fi
            fi

            vpn_command=(sudo openvpn
              --config /tmp/config.ovpn
              --route 169.254.0.0 255.255.0.0 net_gateway
              --script-security 2
              --up /etc/openvpn/update-systemd-resolved --up-restart
              --down /etc/openvpn/update-systemd-resolved --down-pre
              --dhcp-option DOMAIN-ROUTE .)

            if grep -q auth-user-pass /tmp/config.ovpn; then
              vpn_command+=(--auth-user-pass /tmp/vpn.login)
            fi

            # Uruchom VPN w tle
            "${vpn_command[@]}" > /tmp/openvpn.log 2>&1 &
            VPN_PID=$!

            # Czekaj na połączenie
            counter=1
            until grep -q "Initialization Sequence Completed" /tmp/openvpn.log || [ "$counter" -ge 10 ]; do
              ((counter++))
              echo "Attempting to connect to VPN server..."
              sleep 2
            done

            if ! grep -q "Initialization Sequence Completed" /tmp/openvpn.log; then
              echo "Unable to establish VPN connection. Exiting."
              kill $VPN_PID || true
              exit 1
            else
              echo "VPN connected successfully."
              echo "Public IP is now: $(curl -s checkip.amazonaws.com)"
            fi

      - run:
          name: Run commands in our infrastructure
          command: |
            # Tutaj wpisz swoje komendy
            echo "Running infrastructure commands..."

      - run:
          name: Disconnect from OpenVPN
          command: |
            sudo killall openvpn || true
          when: always

workflows:
  btd:
    jobs:
      - build:
          filters:
            branches:
              only: main
