version: 2.1

jobs:
  test_vpn_connection:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout

      - run:
          name: Instalacja OpenVPN
          command: |
            sudo apt-get update
            sudo apt-get install -y openvpn
      - run:
    name: Start VPN
    command: |
      echo "$VPN_CONFIG" | base64 --decode > client.ovpn

      echo "auth-nocache" >> client.ovpn
      echo "redirect-gateway def1" >> client.ovpn

      # NIE pozwól aby grep zabił joba
      grep -q "^auth-user-pass" client.ovpn || echo "auth-user-pass /tmp/creds" >> client.ovpn || true

      echo "$VPN_USER" > /tmp/creds
      echo "$VPN_PASS" >> /tmp/creds

      sudo openvpn \
        --config client.ovpn \
        --daemon \
        --log /tmp/ovpn.log \
        --verb 5 || true

      echo "Czekam na ustanowienie tunelu..."
      sleep 30

      echo "==== LOG OpenVPN (ASCII cleaned) ===="
      tr < /tmp/ovpn.log -d '\000' | tail -n 200 || true

      - run:
          name: Weryfikacja tunelu
          command: |
            echo "=== Interfaces ==="
            ip a
            echo "=== Routing ==="
            ip route
            echo "=== Test IP ==="
            curl -s https://ifconfig.me/ip
            echo

      - run:
          name: Instalacja zależności
          command: npm install

      - run:
          name: Uruchomienie testów Cypress
          command: npx cypress run --browser electron --spec "cypress/e2e/vpn-test.cy.js"

workflows:
  pipeline:
    jobs:
      - test_vpn_connection:
          filters:
            branches:
              only: main
