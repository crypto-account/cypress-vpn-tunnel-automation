version: 2.1

jobs:
  test_vpn_connection:
    machine: true
    resource_class: medium

    steps:
      - checkout
      
      - run:
          name: Use Node.js 20
          command: |
            nvm install 20
            nvm use 20
            node -v
            npm -v

      - run:
          name: Install Cypress 
          command: |
            npm install cypress 

      - run:
          name: Install OpenVPN
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo apt update
            sudo apt install -y openvpn openvpn-systemd-resolved

      - run:
          name: Check IP before VPN connection
          command: |
            echo "Public IP before VPN connection is $(curl -s checkip.amazonaws.com)"
      - run:
          name: VPN Setup and Connect
          command: |
            # 1. Decode config
            echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn

            # 2. Fix potential IPv6 leaks and DNS issues
            # We add these flags to the command line to ensure it forces traffic through the tunnel
            sudo openvpn \
              --config /tmp/config.ovpn \
              --daemon \
              --log /tmp/openvpn.log \
              --pull-filter ignore "auth-token" \
              --route-nopull \
              --route 0.0.0.0 0.0.0.0 vpn_gateway \
              --dhcp-option DNS 8.8.8.8

            echo "Waiting for VPN to connect..."
            timeout 60s bash -c 'until grep -q "Initialization Sequence Completed" /tmp/openvpn.log; do sleep 2; done'

            if [ $? -ne 0 ]; then
              echo "VPN failed to initialize within 60 seconds!"
              cat /tmp/openvpn.log
              exit 1
            fi

            echo "VPN connected. Verifying IP..."
            # Wait a moment for routing tables to update
            sleep 5
            FINAL_IP=$(curl -s https://checkip.amazonaws.com)
            echo "Current Public IP: $FINAL_IP"
     
      - run:
          name: Run Cypress Tests
          command: |
            npm install
            npx cypress run --browser electron --spec "cypress/e2e/vpn-test.cy.js"

      - run:
          name: Disconnect from OpenVPN
          command: |
            sudo killall openvpn || true
          when: always

workflows:
  version: 2
  btd:
    jobs:
      - test_vpn_connection:
          filters:
            branches:
              only: main
