version: 2.1

jobs:
  vpn_test_job:
    machine:
      image: ubuntu-2204:2023.10.1  # Better stability for OpenVPN 2.5+
    steps:
      - checkout
  
      - run:
          name: Install OpenVPN and Fix Repositories
          command: |
            # 1. Naprawa kluczy Google Chrome (inaczej apt-get update zwróci błąd)
            curl -fSsL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list

            # 2. Instalacja OpenVPN
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update
            sudo apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" openvpn openvpn-systemd-resolved


      - run:
          name: Connect to VPN Gate
          command: |
            echo "$VPN_CLIENT_CONFIG" | base64 --decode > /tmp/config.ovpn
            
            # Startujemy VPN
            sudo openvpn --config /tmp/config.ovpn --daemon --log /tmp/openvpn.log \
              --script-security 2 \
              --up /etc/openvpn/update-systemd-resolved \
              --down /etc/openvpn/update-systemd-resolved \
              --down-pre

            # KLUCZOWY KROK: Nadanie uprawnień do pliku logów
            sudo chmod 644 /tmp/openvpn.log

            # Teraz grep zadziała bez "Permission denied"
            echo "Waiting for connection..."
            timeout 45s bash -c 'until grep -q "Initialization Sequence Completed" /tmp/openvpn.log; do sleep 2; done'
            
            if [ $? -ne 0 ]; then
              echo "VPN failed! Log content:"
              cat /tmp/openvpn.log
              exit 1
            fi

            echo "VPN Connected! Current IP: $(curl -s https://checkip.amazonaws.com)"

      - run:
          name: Verify IP and Location
          command: |
            echo "Your new IP is: $(curl -s https://checkip.amazonaws.com)"
            curl -s https://ipapi.co/json/ | grep -E "city|country_name"

      - run:
          name: Run your tests (Cypress/Node)
          command: |
            # Your test commands here
            echo "Running tests over VPN..."

workflows:
  test_flow:
    jobs:
      - vpn_test_job